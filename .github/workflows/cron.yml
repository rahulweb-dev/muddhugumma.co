# Scheduled jobs (free replacement for Vercel Cron, which the Hobby plan limits to once a day).
# Each schedule calls https://<site>/api/cron/<job> with the CRON_SECRET bearer token.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
#   SITE_URL     e.g. https://www.muddhugumma.co
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
# GitHub may start scheduled runs a few minutes late; every job is safe to run late or twice.
# Times are UTC (IST = UTC + 5:30). Run any job by hand from the Actions tab ("Run workflow").
name: Scheduled jobs

on:
  schedule:
    - cron: "*/30 * * * *" # back-in-stock
    - cron: "5 * * * *" # abandoned-carts (hourly)
    - cron: "30 3 * * *" # birthdays (09:00 IST)
    - cron: "0 4 * * *" # low-stock (09:30 IST)
    - cron: "30 4 * * *" # review-requests (10:00 IST)
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        type: choice
        options: [back-in-stock, abandoned-carts, birthdays, low-stock, review-requests]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pick the job for this schedule
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "*/30 * * * *") job=back-in-stock ;;
            "5 * * * *") job=abandoned-carts ;;
            "30 3 * * *") job=birthdays ;;
            "0 4 * * *") job=low-stock ;;
            "30 4 * * *") job=review-requests ;;
            *) job="${{ inputs.job }}" ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Call /api/cron/${{ steps.pick.outputs.job }}
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Add SITE_URL and CRON_SECRET in repo secrets."; exit 1; fi
          code=$(curl -sS -o out.json -w "%{http_code}" --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/${{ steps.pick.outputs.job }}")
          cat out.json; echo
          test "$code" = "200"
